<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>赛灵森创意盒</title>
    <link rel="stylesheet" href="scss/styles.scss" />
    <script type="module" src="js/camera_thermal.js"></script>
</head>

<body>
    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>
    <div id="statusMsg" class="alert alert-primary d-none" role="alert"></div>

    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="mx-auto order-0">
            <a class="navbar-brand mx-auto" href="#">远程照相机</a>
        </div>
    </nav>

    <div class="container-sm text-center my-4">
        <div id="pinWarning" class="alert alert-danger d-none" role="alert"></div>
        <p id="shotTime"></p>
        <div class="row g-2 mb-3" style="max-width: 640px; margin: 0 auto;">
            <div class="col-12">
                <label for="sdaPinSelect" class="form-label">I2C SDA 引脚</label>
                <select id="sdaPinSelect" class="form-select">
                    <option selected value="-1">请选择 SDA 引脚</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                </select>
            </div>
        </div>
        <button id="cameraOneshot" class="btn btn-primary mx-auto">单次</button>
        <button id="cameraReset" class="btn btn-primary mx-auto">连续</button>
        <button id="imageRotate" class="btn btn-secondary mx-auto">停止</button>
        <div class="mt-3" style="max-width: 640px; margin: 0 auto;">
            <label for="temperatureRange" class="form-label">温度显示范围</label>
            <select id="temperatureRange" class="form-select">
                <option value="body" selected>20°C 到 45°C（人体）</option>
                <option value="environment">-10°C 到 50°C（环境）</option>
                <option value="full">-40°C 到 300°C（全量程）</option>
            </select>
        </div>
        <div class="my-4">
            <div style="position: relative; width: 100%; max-width: 640px; margin: 0 auto;">
                <canvas id="thermalMap" width="640" height="480" class="mx-auto" style="width: 100%; max-width: 640px; border: 1px solid #ccc; display: block;"></canvas>
                <div id="thermalLoading" class="d-none" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.62);">
                    <div style="text-align: center; color: #333;">
                        <div class="spinner-border" role="status" aria-hidden="true"></div>
                        <div class="mt-2">数据读取中...</div>
                    </div>
                </div>
            </div>
            <div id="thermalLegend" style="height: 14px; max-width: 640px; margin: 10px auto 0; background: linear-gradient(90deg, #0b3d91 0%, #0a8bdc 25%, #35d4d4 45%, #f0e442 70%, #f39c12 85%, #d7191c 100%);"></div>
            <div class="d-flex justify-content-between" style="max-width: 640px; margin: 6px auto 0; font-size: 12px; color: #444;">
                <span>冷</span>
                <span>热</span>
            </div>
            <div class="mt-3" style="max-width: 640px; margin: 0 auto;">
                <div id="tempScale">量程: 20.0 °C 到 45.0 °C</div>
                <div id="tempMin">最低: --.- °C</div>
                <div id="tempMax">最高: --.- °C</div>
                <div id="tempCenter">中心: --.- °C</div>
            </div>
        </div>
    </div>
</body>

</html>
